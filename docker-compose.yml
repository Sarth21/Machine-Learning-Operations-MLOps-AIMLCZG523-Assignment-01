# Local stack: API + Prometheus + Grafana   ->   docker compose up --build
#   API http://localhost:8000 | Prometheus http://localhost:9090 | Grafana http://localhost:3000 (admin/admin)
services:
  api:
    build: .
    image: heart-disease-api:1.0.0
    ports: ["8000:8000"]
    environment: {LOG_LEVEL: INFO, LOG_FEATURES: "false"}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.2.0
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin, GF_USERS_ALLOW_SIGN_UP: "false"}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
