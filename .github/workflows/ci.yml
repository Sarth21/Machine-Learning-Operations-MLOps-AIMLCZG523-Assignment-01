name: CI/CD

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push image to GHCR on main

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: heart-disease-api
  MLFLOW_ALLOW_FILE_STORE: "true"

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install flake8
      - run: flake8 . --count --statistics --show-source

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest with coverage
        run: pytest --cov=heartml --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage.xml

  train:
    name: Train model (MLflow tracked)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Download dataset (UCI)
        run: python scripts/download_data.py --force
      - name: Clean data
        run: python -c "import logging; logging.basicConfig(level=logging.INFO); from heartml import data; data.prepare()"
      - run: python -m heartml.eda
      - name: Train + evaluate + log to MLflow
        run: set -o pipefail; python -m heartml.train 2>&1 | tee train.log
      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("reports/metrics.json"))
          print("## Model training summary\n")
          print(f"Data source: `{m['data_source']}` | selected model: **{m['selected_model']}**\n")
          print("| model | CV ROC-AUC | test ROC-AUC | test accuracy | test recall |")
          print("|---|---|---|---|---|")
          for n, cv in m["cv"].items():
              t = m["test"][n]
              print(f"| {n} | {cv['roc_auc']['mean']:.3f} | {t['roc_auc']:.3f} | {t['accuracy']:.3f} | {t['recall']:.3f} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: |
            models/
            reports/
            mlruns/
            data/processed/
            train.log

  docker:
    name: Docker build + container smoke test
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - name: Fetch the model trained in this run
        uses: actions/download-artifact@v4
        with:
          name: training-outputs
          path: .
      - run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - run: docker run -d --name heart-api -p 8000:8000 $IMAGE_NAME:latest
      - name: Smoke test the container
        run: python scripts/smoke_test.py http://localhost:8000
      - name: Collect container logs
        if: always()
        run: docker logs heart-api > container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: container-logs, path: container.log}
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          REPO=$(echo "ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag $IMAGE_NAME:latest $REPO:latest
          docker tag $IMAGE_NAME:latest $REPO:${{ github.sha }}
          docker push $REPO:latest
          docker push $REPO:${{ github.sha }}

  k8s-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Render kustomization and schema-check with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/ > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml
