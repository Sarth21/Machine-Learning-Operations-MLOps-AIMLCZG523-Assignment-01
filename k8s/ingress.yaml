# Alternative to the LoadBalancer. Needs an ingress controller (`minikube addons enable ingress`),
# then add "<minikube ip>  heart-api.local" to /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-api
  namespace: heart-mlops
  annotations: {nginx.ingress.kubernetes.io/proxy-body-size: "1m"}
spec:
  ingressClassName: nginx
  rules:
    - host: heart-api.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: heart-api, port: {number: 80}}}}
